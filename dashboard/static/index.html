<!doctype html>
<html lang="fr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark light" />
    <meta name="theme-color" content="#0C0F15" />
    <meta name="description" content="RPC Explorer & Benchmark Lab — démonstrateur pédagogique du Remote Procedure Call : JSON-RPC maison, gRPC et REST comparés, mesurés et mis à l'épreuve." />
    <title>RPC Explorer · Benchmark Lab</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />

    <!-- Thème appliqué avant le premier rendu : pas de flash sombre → clair. -->
    <script>
      (function () {
        var theme = null;
        try {
          theme = localStorage.getItem('rpcx.theme');
        } catch (e) {}
        if (theme !== 'dark' && theme !== 'light') {
          theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        }
        document.documentElement.dataset.theme = theme;
      })();
    </script>

    <link rel="preload" href="fonts/inter-latin-opsz-normal.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="fonts/jetbrains-mono-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin />

    <link rel="stylesheet" href="css/tokens.css" />

    <link rel="stylesheet" href="css/layout.css" />
    <link rel="stylesheet" href="css/components.css" />

    <link rel="stylesheet" href="css/pages/chaos.css" />
    <link rel="stylesheet" href="css/pages/contract.css" />
    <link rel="stylesheet" href="css/pages/compare.css" />
    <link rel="stylesheet" href="css/pages/learn.css" />
    <link rel="stylesheet" href="css/pages/kit.css" />

    <script type="module" src="js/app.js"></script>
  </head>
